<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIoT 智慧燈控制面板</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>💡 AIoT 智慧燈控制系統</h1>

    <form method="POST" action="/control">
      <input type="text" name="command" placeholder="輸入：開燈 或 關燈" required>
      <button type="submit">送出</button>
    </form>

    {% if result %}
      <div class="result">
        <p>{{ result }}</p>
      </div>
    {% endif %}

    <footer>
      <p>開發者：翔田 ｜ 指導：ChatGPT（GPT-5）</p>
    </footer>
  </div>
</body>
</html>
